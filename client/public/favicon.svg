<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Institutional Slate/Navy) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <!-- Brand Cyan-to-Emerald Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00F5A0" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Badge with Premium Border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#3a506b" stroke-width="6" opacity="0.4" />

  <!-- Background Decorative Grid (Subtle Forex Chart feel) -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#3a506b" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />
  <line x1="256" y1="96" x2="256" y2="416" stroke="#3a506b" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />

  <!-- MAIN ICON: Stylized Geometric "T" + "S" Arrow Structure -->
  <g filter="url(#subtleGlow)">
    <!-- Horizontal Crossbar (Top of "T") -->
    <path d="M 112 168 C 112 154.7, 122.7 144, 136 144 L 376 144 C 389.3 144, 400 154.7, 400 168 C 400 181.3, 389.3 192, 376 192 L 136 192 C 122.7 192, 112 181.3, 112 168 Z" 
          fill="#FFFFFF" />

    <!-- Sharp Upward "FX Surge" Diagonal Path forming the 'S' and Growth Trend -->
    <path d="M 152 352 L 236 352 C 248 352, 258 344, 264 334 L 312 250 C 318 240, 328 234, 340 234 L 368 234" 
          stroke="url(#primaryGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Central Vertical Stem (Body of "T" + Candlestick Node) -->
    <rect x="238" y="168" width="36" height="96" rx="18" fill="#FFFFFF" />

    <!-- High-Impact Forex Arrow Head (The "FX" Signal Point) -->
    <path d="M 324 160 L 400 236 L 324 312" 
          stroke="url(#primaryGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Bullish Indicator Point (Accent Dot) -->
  <circle cx="152" cy="352" r="22" fill="#00D2FF" />
</svg>